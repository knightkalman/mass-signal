<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <title>Mass Signal — 22 Watchlist Tickers</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101a20;
      --panel: #17242b;
      --panel-light: #1c2b33;
      --line: #30424a;
      --text: #edf2ec;
      --muted: #9aadae;
      --green: #76d6a0;
      --green-glow: rgba(118, 214, 160, 0.15);
      --blue: #77c8ec;
      --orange: #ffbb70;
      --red: #ff8d82;
      --red-glow: rgba(255, 141, 130, 0.15);
      --yellow: #f3d17c;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 15% -15%, #243c39 0, transparent 40rem),
        radial-gradient(ellipse at 85% -10%, #1c2f38 0, transparent 35rem),
        var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select { font: inherit; }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 60px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(16, 26, 32, 0.94);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      font-size: 1.6rem;
      color: var(--green);
      line-height: 1;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-title .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* 24h / 7d Timeframe Switcher */
    .timeframe-switch {
      display: inline-flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .timeframe-btn {
      padding: 5px 13px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: all 0.15s ease;
    }
    .timeframe-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    .timeframe-btn.active {
      background: #233742;
      color: var(--green);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .search-input {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 6px 12px;
      font-size: 0.85rem;
      width: 170px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--green);
    }

    .btn {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--green); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .pill-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #1c2b33;
      border: 1px solid var(--line);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pill.bullish { color: var(--green); border-color: rgba(118, 214, 160, 0.3); }
    .pill.bearish { color: var(--red); border-color: rgba(255, 141, 130, 0.3); }
    .pill.pill-closed {
      color: var(--yellow);
      border-color: rgba(243, 209, 124, 0.45);
      background: rgba(243, 209, 124, 0.12);
    }
    .pill.pill-closed .closed-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--yellow);
      display: inline-block;
    }

    /* Grid Layout for 22 Tickers */
    .tickers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
      gap: 16px;
    }

    @media (max-width: 960px) {
      .tickers-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Ticker Card */
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(155deg, var(--panel-light), var(--panel));
      padding: 13px 16px 12px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      border-color: #445963;
      transform: translateY(-2px);
    }

    /* Card Header: 3-column layout (Symbol/Title | Center Matrix | Price) */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-title-group {
      min-width: 0;
      flex: 1 1 auto;
    }

    .ticker-symbol-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ticker-symbol {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .instrument-badge {
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 4px;
      background: #23353e;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .ticker-name {
      color: var(--muted);
      font-size: 0.76rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
      max-width: 140px;
    }

    /* Center Matrix: News Sentiment & Technical Indicators */
    .card-center-matrix {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1 0 auto;
      padding: 0 4px;
    }

    .center-matrix-row {
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: center;
      white-space: nowrap;
    }

    .matrix-sent-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.3;
    }
    .matrix-sent-badge.bullish {
      background: rgba(118, 214, 160, 0.16);
      color: var(--green);
      border: 1px solid rgba(118, 214, 160, 0.35);
    }
    .matrix-sent-badge.bearish {
      background: rgba(255, 141, 130, 0.16);
      color: var(--red);
      border: 1px solid rgba(255, 141, 130, 0.35);
    }
    .matrix-sent-badge.neutral,
    .matrix-sent-badge.mixed,
    .matrix-sent-badge.unclear {
      background: rgba(243, 209, 124, 0.16);
      color: var(--yellow);
      border: 1px solid rgba(243, 209, 124, 0.35);
    }

    .matrix-sent-score {
      font-size: 0.72rem;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      color: var(--text);
    }

    .matrix-sent-counts {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .matrix-tech-trend {
      font-size: 0.72rem;
      cursor: help;
    }

    .matrix-tech-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(28, 43, 51, 0.85);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
      font-family: ui-monospace, monospace;
    }
    .matrix-tech-pill b {
      color: var(--text);
    }

    /* Price Group */
    .card-price-group {
      text-align: right;
      flex-shrink: 0;
    }

    .ticker-price {
      font-size: 1.22rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .ticker-change {
      font-size: 0.76rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .ticker-change.positive { color: var(--green); }
    .ticker-change.negative { color: var(--red); }
    .ticker-change.neutral { color: var(--muted); }

    /* Chart SVG Area */
    .chart-container {
      position: relative;
      width: 100%;
      height: 140px;
      margin: 4px 0 6px;
      background: rgba(16, 26, 32, 0.45);
      border-radius: 6px;
      overflow: hidden;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid-line {
      stroke: #25353d;
      stroke-dasharray: 2 4;
      stroke-width: 1;
    }

    .axis-label {
      fill: #708485;
      font-size: 9px;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .chart-line {
      fill: none;
      stroke-width: 2.2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .chart-line.positive { stroke: var(--green); }
    .chart-line.negative { stroke: var(--red); }
    .chart-line.neutral { stroke: var(--blue); }

    .chart-area {
      stroke: none;
      opacity: 0.22;
    }

    .prev-close-line {
      stroke: #536b75;
      stroke-dasharray: 2 4;
      stroke-width: 1;
      opacity: 0.6;
    }

    /* Weekend / Market Closed SVG Features */
    .weekend-closed-band {
      fill: #f3d17c;
      opacity: 0.08;
    }

    .weekend-boundary {
      stroke: #f3d17c;
      stroke-width: 1.2;
      stroke-dasharray: 3 4;
      opacity: 0.75;
    }

    .weekend-label {
      fill: #f3d17c;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0.88;
      pointer-events: none;
    }

    .weekend-carry-line {
      fill: none;
      stroke-width: 2.0;
      stroke-dasharray: 3 4;
      stroke-linecap: round;
      opacity: 0.75;
    }
    .weekend-carry-line.positive { stroke: var(--green); }
    .weekend-carry-line.negative { stroke: var(--red); }
    .weekend-carry-line.neutral { stroke: var(--blue); }

    /* Interactive Hover */
    .crosshair {
      stroke: #9aadae;
      stroke-width: 1;
      stroke-dasharray: 2 2;
      display: none;
    }

    .hover-dot {
      r: 4;
      stroke-width: 2;
      stroke: #101a20;
      display: none;
    }
    .hover-dot.positive { fill: var(--green); }
    .hover-dot.negative { fill: var(--red); }
    .hover-dot.neutral { fill: var(--blue); }

    /* Market Closed Watermark Tag inside Chart */
    .market-closed-watermark {
      position: absolute;
      top: 6px;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(23, 36, 43, 0.88);
      border: 1px solid rgba(243, 209, 124, 0.35);
      color: var(--yellow);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .closed-pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--yellow);
      display: inline-block;
      box-shadow: 0 0 5px var(--yellow);
    }

    /* Card Footer Stats */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px solid rgba(48, 66, 74, 0.5);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .card-footer span b {
      color: var(--text);
      font-weight: 600;
    }

    /* Tooltip */
    .tooltip-float {
      position: absolute;
      padding: 3px 7px;
      background: #1e3038;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      font-size: 0.7rem;
      pointer-events: none;
      transform: translate(-50%, -120%);
      white-space: nowrap;
      display: none;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand-wrap">
        <span class="brand-mark">∿</span>
        <div class="brand-title">
          <h1>MASS SIGNAL</h1>
          <p class="subtitle">22 Watchlist Tickers Monitor &amp; Live Intraday Charts</p>
        </div>
      </div>
      <div class="header-actions">
        <!-- 24h and 7d View Switcher on top of the page for all charts -->
        <div class="timeframe-switch" role="group" aria-label="Chart time range switcher">
          <button type="button" class="timeframe-btn active" data-range="24h" id="tf-btn-24h">24h</button>
          <button type="button" class="timeframe-btn" data-range="7d" id="tf-btn-7d">7d</button>
        </div>
        <input type="text" id="search-box" class="search-input" placeholder="Filter tickers… (e.g. NVDA, OIL)" autocomplete="off">
        <button id="refresh-btn" class="btn">
          <span>↻</span> Refresh
        </button>
      </div>
    </header>

    <div class="meta-bar">
      <div class="pill-group">
        <span class="pill" id="total-count-pill">22 Tickers</span>
        <span class="pill bullish" id="bullish-count-pill">— Bullish</span>
        <span class="pill bearish" id="bearish-count-pill">— Bearish</span>
        <span class="pill pill-closed" id="weekend-status-pill" style="display:none;">
          <span class="closed-dot"></span> Market Closed · Weekend
        </span>
      </div>
      <div id="last-updated">Loading live market data…</div>
    </div>

    <!-- 22 Tickers Grid -->
    <main class="tickers-grid" id="tickers-grid" aria-live="polite">
      <div class="empty-state">Loading ticker charts…</div>
    </main>
  </div>

  <script>
    "use strict";

    const SVG_NS = "http://www.w3.org/2000/svg";
    const tickersGrid = document.querySelector("#tickers-grid");
    const lastUpdatedEl = document.querySelector("#last-updated");
    const refreshBtn = document.querySelector("#refresh-btn");
    const searchBox = document.querySelector("#search-box");
    const totalCountPill = document.querySelector("#total-count-pill");
    const bullishCountPill = document.querySelector("#bullish-count-pill");
    const bearishCountPill = document.querySelector("#bearish-count-pill");
    const weekendStatusPill = document.querySelector("#weekend-status-pill");
    const timeframeButtons = document.querySelectorAll(".timeframe-btn");

    let allTickerData = {};
    let allMarketData = {};
    let activeFilter = "";
    let activeTimeframe = "24h"; // "24h" or "7d"

    const TICKER_DEFS = [
      { symbol: "OIL", id: 17, name: "Crude Oil (WTI)", yahoo: "CL=F", asset: "commodities" },
      { symbol: "NVDA", id: 1137, name: "NVIDIA Corporation", yahoo: "NVDA", asset: "stocks" },
      { symbol: "MU", id: 1130, name: "Micron Technology Inc.", yahoo: "MU", asset: "stocks" },
      { symbol: "ORCL", id: 1135, name: "Oracle Corporation", yahoo: "ORCL", asset: "stocks" },
      { symbol: "CAT", id: 1012, name: "Caterpillar Inc.", yahoo: "CAT", asset: "stocks" },
      { symbol: "GS", id: 1467, name: "The Goldman Sachs Group Inc.", yahoo: "GS", asset: "stocks" },
      { symbol: "INTC", id: 1021, name: "Intel Corporation", yahoo: "INTC", asset: "stocks" },
      { symbol: "MS", id: 1976, name: "Morgan Stanley", yahoo: "MS", asset: "stocks" },
      { symbol: "PLTR", id: 7991, name: "Palantir Technologies Inc.", yahoo: "PLTR", asset: "stocks" },
      { symbol: "SHOP", id: 4148, name: "Shopify Inc.", yahoo: "SHOP", asset: "stocks" },
      { symbol: "AMD", id: 1832, name: "Advanced Micro Devices Inc.", yahoo: "AMD", asset: "stocks" },
      { symbol: "ASML", id: 4244, name: "ASML Holding N.V.", yahoo: "ASML", asset: "stocks" },
      { symbol: "ARM", id: 1365, name: "Arm Holdings plc", yahoo: "ARM", asset: "stocks" },
      { symbol: "TXN", id: 1634, name: "Texas Instruments Incorporated", yahoo: "TXN", asset: "stocks" },
      { symbol: "COP", id: 1510, name: "ConocoPhillips", yahoo: "COP", asset: "stocks" },
      { symbol: "MRK", id: 1027, name: "Merck & Co., Inc.", yahoo: "MRK", asset: "stocks" },
      { symbol: "GOOGL", id: 6434, name: "Alphabet Inc.", yahoo: "GOOGL", asset: "stocks" },
      { symbol: "QCOM", id: 1485, name: "QUALCOMM Incorporated", yahoo: "QCOM", asset: "stocks" },
      { symbol: "AMZN", id: 1005, name: "Amazon.com Inc.", yahoo: "AMZN", asset: "stocks" },
      { symbol: "META", id: 1003, name: "Meta Platforms Inc.", yahoo: "META", asset: "stocks" },
      { symbol: "CRWD", id: 5506, name: "CrowdStrike Holdings Inc.", yahoo: "CRWD", asset: "stocks" },
      { symbol: "HOOD", id: 9272, name: "Robinhood Markets, Inc.", yahoo: "HOOD", asset: "stocks" },
    ];

    /* Weekend & Market Hours Helper (New York Wall Time) */
    const nyDateFormatter = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York",
      weekday: "short",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

    function getNYParts(date) {
      return Object.fromEntries(
        nyDateFormatter.formatToParts(date)
          .filter(p => p.type !== "literal")
          .map(p => [p.type, p.value])
      );
    }

    function isWeekendNow(date = new Date()) {
      const parts = getNYParts(date);
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const weekday = weekdays.indexOf(parts.weekday);
      const hour = Number(parts.hour);
      const minute = Number(parts.minute || 0);

      // Friday after 16:00 NY
      if (weekday === 5 && hour >= 16) return true;
      // All day Saturday
      if (weekday === 6) return true;
      // All day Sunday
      if (weekday === 0) return true;
      // Monday before 09:30 NY
      if (weekday === 1 && (hour < 9 || (hour === 9 && minute < 30))) return true;
      return false;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function svgEl(tag, attrs = {}) {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
      return node;
    }

    function formatTime(isoStr) {
      if (!isoStr) return "";
      try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) + " UTC";
      } catch {
        return "";
      }
    }

    function formatDateShort(isoStr) {
      if (!isoStr) return "";
      try {
        const d = new Date(isoStr);
        return d.toLocaleDateString([], { month: "short", day: "numeric", timeZone: "UTC" });
      } catch {
        return "";
      }
    }

    function createChart(ticker, item, width = 420, height = 135) {
      const rawHistory = (item && Array.isArray(item.history) && item.history.length > 0)
        ? item.history
        : (item && item.price ? [{ timestamp: item.price_timestamp || new Date().toISOString(), price: item.price }] : []);

      // Parse and sort points
      const allPoints = rawHistory.map(h => ({
        time: new Date(h.timestamp),
        price: Number(h.price),
        raw: h
      })).filter(pt => !isNaN(pt.time.getTime()) && Number.isFinite(pt.price)).sort((a, b) => a.time - b.time);

      const isPositive = (item?.change ?? 0) >= 0;
      const statusClass = isPositive ? "positive" : "negative";

      const container = el("div", "chart-container");
      const tooltip = el("div", "tooltip-float");
      container.append(tooltip);

      // Market Closed Watermark Tag if currently weekend
      const marketIsClosed = isWeekendNow() || item?.isWeekendClosed || allMarketData?.benchmarks?.isWeekendClosed;
      if (marketIsClosed) {
        const closedBadge = el("div", "market-closed-watermark");
        const dot = el("span", "closed-pulse-dot");
        closedBadge.append(dot, document.createTextNode(" Market Closed"));
        container.append(closedBadge);
      }

      const svg = svgEl("svg", {
        viewBox: `0 0 ${width} ${height}`,
        preserveAspectRatio: "none",
        class: "chart-svg"
      });

      // Defs for gradients
      const defs = svgEl("defs");

      // Green gradient
      const greenGrad = svgEl("linearGradient", { id: `green-grad-${ticker.symbol}`, x1: "0", y1: "0", x2: "0", y2: "1" });
      greenGrad.append(svgEl("stop", { offset: "0%", "stop-color": "#76d6a0", "stop-opacity": "0.35" }));
      greenGrad.append(svgEl("stop", { offset: "100%", "stop-color": "#76d6a0", "stop-opacity": "0.0" }));

      // Red gradient
      const redGrad = svgEl("linearGradient", { id: `red-grad-${ticker.symbol}`, x1: "0", y1: "0", x2: "0", y2: "1" });
      redGrad.append(svgEl("stop", { offset: "0%", "stop-color": "#ff8d82", "stop-opacity": "0.35" }));
      redGrad.append(svgEl("stop", { offset: "100%", "stop-color": "#ff8d82", "stop-opacity": "0.0" }));

      defs.append(greenGrad, redGrad);
      svg.append(defs);

      if (!allPoints.length) {
        svg.append(svgEl("text", {
          x: width / 2,
          y: height / 2,
          "text-anchor": "middle",
          fill: "#708485",
          "font-size": "11"
        }));
        container.append(svg);
        return container;
      }

      // Filter visible points according to activeTimeframe ("24h" or "7d")
      let visiblePoints = allPoints;
      if (activeTimeframe === "24h") {
        const latestMs = allPoints[allPoints.length - 1].time.getTime();
        const cutoffMs = latestMs - 24 * 60 * 60 * 1000;
        const candidatePoints = allPoints.filter(p => p.time.getTime() >= cutoffMs);
        // If data falls on weekend or sparse, ensure at least last active session is visible
        visiblePoints = candidatePoints.length >= 4 ? candidatePoints : allPoints.slice(-36);
      }

      const paddingLeft = 38;
      const paddingRight = 14;
      const paddingTop = 12;
      const paddingBottom = 16;
      const plotWidth = width - paddingLeft - paddingRight;
      const plotHeight = height - paddingTop - paddingBottom;

      const prices = visiblePoints.map(h => h.price);
      const prevClose = Number(item?.previous_close);
      if (Number.isFinite(prevClose)) prices.push(prevClose);

      let minP = Math.min(...prices);
      let maxP = Math.max(...prices);
      const span = maxP - minP;
      const padP = Math.max(span * 0.1, maxP * 0.003, 0.01);
      minP -= padP;
      maxP += padP;

      const minT = visiblePoints[0].time.getTime();
      let maxT = visiblePoints[visiblePoints.length - 1].time.getTime();

      // Detect Weekend Windows in visible data (gap >= 36 hours between consecutive points)
      const weekendWindows = [];
      for (let i = 1; i < visiblePoints.length; i++) {
        const gap = visiblePoints[i].time.getTime() - visiblePoints[i - 1].time.getTime();
        if (gap >= 36 * 60 * 60 * 1000) {
          weekendWindows.push({
            closeTime: visiblePoints[i - 1].time.getTime(),
            closePrice: visiblePoints[i - 1].price,
            openTime: visiblePoints[i].time.getTime(),
            openPrice: visiblePoints[i].price
          });
        }
      }

      // If activeTimeframe is 7d and currently weekend, extend maxT slightly for visible weekend band
      if (marketIsClosed && (Date.now() - maxT) > 12 * 60 * 60 * 1000 && activeTimeframe === "7d") {
        const extendedT = Math.min(Date.now(), maxT + 48 * 60 * 60 * 1000);
        weekendWindows.push({
          closeTime: maxT,
          closePrice: visiblePoints[visiblePoints.length - 1].price,
          openTime: extendedT,
          openPrice: visiblePoints[visiblePoints.length - 1].price,
          isCurrentWeekend: true
        });
        maxT = extendedT;
      }

      const timeSpan = maxT - minT || 1;
      const getX = (t) => paddingLeft + ((t - minT) / timeSpan) * plotWidth;
      const getY = (price) => paddingTop + (1 - (price - minP) / (maxP - minP)) * plotHeight;

      // Horizontal grid lines & Y labels (3 levels)
      for (let i = 0; i <= 2; i++) {
        const pVal = minP + ((maxP - minP) * i) / 2;
        const yCoord = getY(pVal);
        svg.append(svgEl("line", {
          x1: paddingLeft,
          x2: width - paddingRight,
          y1: yCoord,
          y2: yCoord,
          class: "grid-line"
        }));
        const pFormatted = pVal >= 1000 ? pVal.toFixed(0) : pVal >= 10 ? pVal.toFixed(1) : pVal.toFixed(2);
        const label = svgEl("text", {
          x: paddingLeft - 4,
          y: yCoord + 3,
          "text-anchor": "end",
          class: "axis-label"
        });
        label.textContent = pFormatted;
        svg.append(label);
      }

      // Draw Weekend Bands & Labels for market closed feature
      for (const w of weekendWindows) {
        const startX = Math.max(paddingLeft, getX(w.closeTime));
        const endX = Math.min(width - paddingRight, getX(w.openTime));
        if (endX > startX) {
          // Shaded weekend closed rectangle
          const rect = svgEl("rect", {
            x: startX,
            y: paddingTop,
            width: endX - startX,
            height: plotHeight,
            class: "weekend-closed-band"
          });
          svg.append(rect);

          // Close boundary line
          svg.append(svgEl("line", {
            x1: startX,
            x2: startX,
            y1: paddingTop,
            y2: paddingTop + plotHeight,
            class: "weekend-boundary"
          }));

          // Open boundary line (if before right edge)
          if (endX < width - paddingRight) {
            svg.append(svgEl("line", {
              x1: endX,
              x2: endX,
              y1: paddingTop,
              y2: paddingTop + plotHeight,
              class: "weekend-boundary"
            }));
          }

          // Centered "MARKET CLOSED" label
          if (endX - startX > 35) {
            const labelX = (startX + endX) / 2;
            const wLabel = svgEl("text", {
              x: labelX,
              y: paddingTop + 13,
              "text-anchor": "middle",
              class: "weekend-label"
            });
            wLabel.textContent = "MARKET CLOSED";
            svg.append(wLabel);
          }
        }
      }

      // Previous close reference line
      if (Number.isFinite(prevClose) && prevClose >= minP && prevClose <= maxP) {
        const prevY = getY(prevClose);
        svg.append(svgEl("line", {
          x1: paddingLeft,
          x2: width - paddingRight,
          y1: prevY,
          y2: prevY,
          class: "prev-close-line"
        }));
      }

      // Generate points with coordinates
      const coords = visiblePoints.map((pt) => ({
        x: getX(pt.time.getTime()),
        y: getY(pt.price),
        raw: pt
      }));

      // Build path segments, inserting dotted carry line over weekend gaps
      let currentPath = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
      const allPaths = [];

      for (let i = 1; i < coords.length; i++) {
        const prevPt = coords[i - 1];
        const pt = coords[i];
        const gap = pt.raw.time.getTime() - prevPt.raw.time.getTime();

        if (gap >= 36 * 60 * 60 * 1000) {
          // End solid path at previous point
          allPaths.push(currentPath);

          // Add horizontal weekend carry line (dotted) from Friday close to Monday open
          const carryY = getY(prevPt.raw.price);
          const carryLine = svgEl("line", {
            x1: prevPt.x.toFixed(1),
            x2: pt.x.toFixed(1),
            y1: carryY.toFixed(1),
            y2: carryY.toFixed(1),
            class: `weekend-carry-line ${statusClass}`
          });
          svg.append(carryLine);

          // Start new solid segment from next point
          currentPath = `M ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
        } else {
          currentPath += ` L ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
        }
      }
      allPaths.push(currentPath);

      // Render Area Fill
      let dArea = `M ${coords[0].x.toFixed(1)} ${(paddingTop + plotHeight).toFixed(1)} L ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
      for (let i = 1; i < coords.length; i++) {
        dArea += ` L ${coords[i].x.toFixed(1)} ${coords[i].y.toFixed(1)}`;
      }
      dArea += ` L ${coords[coords.length - 1].x.toFixed(1)} ${(paddingTop + plotHeight).toFixed(1)} Z`;

      const areaEl = svgEl("path", {
        d: dArea,
        fill: isPositive ? `url(#green-grad-${ticker.symbol})` : `url(#red-grad-${ticker.symbol})`,
        class: "chart-area"
      });
      svg.append(areaEl);

      // Render solid path lines
      for (const pStr of allPaths) {
        const lineEl = svgEl("path", {
          d: pStr,
          class: `chart-line ${statusClass}`
        });
        svg.append(lineEl);
      }

      // Interactive hover elements
      const crosshair = svgEl("line", {
        y1: paddingTop,
        y2: paddingTop + plotHeight,
        class: "crosshair"
      });
      const hoverDot = svgEl("circle", {
        class: `hover-dot ${statusClass}`
      });
      svg.append(crosshair, hoverDot);

      // Mousemove handler
      container.addEventListener("mousemove", (e) => {
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const normalizedX = (mouseX / rect.width) * width;

        if (normalizedX < paddingLeft || normalizedX > width - paddingRight) {
          crosshair.style.display = "none";
          hoverDot.style.display = "none";
          tooltip.style.display = "none";
          return;
        }

        // Find nearest point
        let nearest = coords[0];
        let minDist = Infinity;
        for (const pt of coords) {
          const dist = Math.abs(pt.x - normalizedX);
          if (dist < minDist) {
            minDist = dist;
            nearest = pt;
          }
        }

        crosshair.setAttribute("x1", nearest.x);
        crosshair.setAttribute("x2", nearest.x);
        crosshair.style.display = "block";

        hoverDot.setAttribute("cx", nearest.x);
        hoverDot.setAttribute("cy", nearest.y);
        hoverDot.style.display = "block";

        const dateStr = activeTimeframe === "7d" ? formatDateShort(nearest.raw.time) + " " : "";
        tooltip.textContent = `$${Number(nearest.raw.price).toFixed(2)} · ${dateStr}${formatTime(nearest.raw.time)}`;
        tooltip.style.left = `${(nearest.x / width) * 100}%`;
        tooltip.style.top = `${(nearest.y / height) * 100}%`;
        tooltip.style.display = "block";
      });

      container.addEventListener("mouseleave", () => {
        crosshair.style.display = "none";
        hoverDot.style.display = "none";
        tooltip.style.display = "none";
      });

      container.append(svg);
      return container;
    }

    function renderCards() {
      tickersGrid.replaceChildren();

      let bullishCount = 0;
      let bearishCount = 0;
      let visibleCount = 0;

      const filterLower = activeFilter.trim().toLowerCase();
      const isWeekendGlobal = isWeekendNow() || allMarketData?.benchmarks?.isWeekendClosed;

      if (weekendStatusPill) {
        weekendStatusPill.style.display = isWeekendGlobal ? "inline-flex" : "none";
      }

      for (const def of TICKER_DEFS) {
        const symKey = def.symbol.toLowerCase();
        const data = allTickerData[symKey] || {};
        const marketSnapshot = (allMarketData.tickers && (allMarketData.tickers[def.symbol] || allMarketData.tickers[def.symbol.toUpperCase()])) || {};

        const matches = !filterLower ||
          def.symbol.toLowerCase().includes(filterLower) ||
          def.name.toLowerCase().includes(filterLower) ||
          String(def.id).includes(filterLower);

        const change = Number(data.change ?? 0);
        const changePct = Number(data.change_percent ?? 0);
        const isBullish = change > 0;
        const isBearish = change < 0;

        if (isBullish) bullishCount++;
        else if (isBearish) bearishCount++;

        if (!matches) continue;
        visibleCount++;

        const card = el("article", "card");
        card.setAttribute("id", `card-${def.symbol.toLowerCase()}`);

        // Card Header: Left (Title), Middle (News Sentiment + Technicals), Right (Price)
        const header = el("div", "card-header");

        // 1. Left: Title & Symbol Group
        const titleGroup = el("div", "card-title-group");
        const symbolRow = el("div", "ticker-symbol-row");
        symbolRow.append(el("span", "ticker-symbol", def.symbol));
        symbolRow.append(el("span", "instrument-badge", `#${def.id}`));
        symbolRow.append(el("span", `pill ${isBullish ? "bullish" : isBearish ? "bearish" : ""}`, def.asset === "commodities" ? "OIL" : "STOCK"));

        if (isWeekendGlobal) {
          const closedPill = el("span", "pill pill-closed");
          closedPill.innerHTML = '<span class="closed-dot"></span> Weekend';
          symbolRow.append(closedPill);
        }

        const nameEl = el("div", "ticker-name", def.name);
        titleGroup.append(symbolRow, nameEl);

        // 2. Middle: News Sentiment General Direction + 24h Content & Technicals
        const centerMatrix = el("div", "card-center-matrix");
        centerMatrix.title = "24h News Sentiment & Technical Indicators from Trading Dashboard";

        // Sentiment metrics
        const sent = marketSnapshot.sentiment || {};
        const sentDir = (sent.dominantDirection || data.price_change_sentiment || "neutral").toUpperCase();
        const sentScore = sent.netSentimentScore !== undefined
          ? (sent.netSentimentScore >= 0 ? `+${sent.netSentimentScore.toFixed(2)}` : sent.netSentimentScore.toFixed(2))
          : (isBullish ? "+0.50" : isBearish ? "-0.50" : "0.00");
        const sentCounts = sent.recent24h
          ? `(${sent.recent24h.bullish || 0}B/${sent.recent24h.bearish || 0}b)`
          : (sent.totalStories ? `(${sent.totalStories}s)` : "");
        const sentBadgeClass = sentDir === "BULLISH" ? "bullish" : (sentDir === "BEARISH" ? "bearish" : "neutral");

        const sentRow = el("div", "center-matrix-row");
        sentRow.append(el("span", `matrix-sent-badge ${sentBadgeClass}`, sentDir));
        sentRow.append(el("span", "matrix-sent-score mono", sentScore));
        if (sentCounts) {
          sentRow.append(el("span", "matrix-sent-counts mono", sentCounts));
        }

        // Technicals metrics (Technicals column from Market Matrix)
        const tech = marketSnapshot.technicals || {};
        const trendIcon = tech.trendAlignment === "bullish" ? "🟢" : (tech.trendAlignment === "bearish" ? "🔴" : "⚪");
        const htfTrendIcon = tech.htfTrendAlignment === "bullish" ? "🟢" : (tech.htfTrendAlignment === "bearish" ? "🔴" : "⚪");
        const rsiVal = tech.rsi14 ? Number(tech.rsi14).toFixed(0) : (data.rsi ? Number(data.rsi).toFixed(0) : "--");
        const rvolVal = tech.rvol ? `${Number(tech.rvol).toFixed(1)}x` : "--";

        const techRow = el("div", "center-matrix-row");
        const trendEl = el("span", "matrix-tech-trend", `${trendIcon}/${htfTrendIcon}`);
        trendEl.title = `Trend (15m: ${tech.trendAlignment || 'n/a'} / 4h: ${tech.htfTrendAlignment || 'n/a'})`;
        techRow.append(trendEl);

        const rsiPill = el("span", "matrix-tech-pill");
        rsiPill.title = "RSI (14)";
        rsiPill.innerHTML = `RSI:<b>${rsiVal}</b>`;
        techRow.append(rsiPill);

        if (rvolVal !== "--") {
          const rvolPill = el("span", "matrix-tech-pill");
          rvolPill.title = "Relative Volume";
          rvolPill.innerHTML = `<b>${rvolVal}</b>`;
          techRow.append(rvolPill);
        }

        centerMatrix.append(sentRow, techRow);

        // 3. Right: Price & Change Group
        const priceGroup = el("div", "card-price-group");
        const curPrice = Number(data.price);
        const priceStr = Number.isFinite(curPrice) ? `$${curPrice.toFixed(2)}` : "—";
        const priceEl = el("div", "ticker-price", priceStr);

        const changeClass = isBullish ? "ticker-change positive" : isBearish ? "ticker-change negative" : "ticker-change neutral";
        const sign = change > 0 ? "+" : "";
        const changeStr = Number.isFinite(change) && Number.isFinite(changePct)
          ? `${sign}${change.toFixed(2)} (${sign}${changePct.toFixed(2)}%)`
          : "—";
        const changeEl = el("div", changeClass, changeStr);

        priceGroup.append(priceEl, changeEl);

        // Assemble Header
        header.append(titleGroup, centerMatrix, priceGroup);
        card.append(header);

        // Chart (supports activeTimeframe 24h / 7d and market closed)
        const chartNode = createChart(def, data);
        card.append(chartNode);

        // Card Footer Stats
        const footer = el("div", "card-footer");
        const prevClose = Number(data.previous_close);
        const prevCloseStr = Number.isFinite(prevClose) ? `$${prevClose.toFixed(2)}` : "—";

        // Calculate low/high based on current timeframe
        const hist = data.history || [];
        let rangePoints = hist;
        if (activeTimeframe === "24h" && hist.length) {
          const maxT = new Date(hist[hist.length - 1].timestamp).getTime();
          const cutoff = maxT - 24 * 60 * 60 * 1000;
          const candidate = hist.filter(h => new Date(h.timestamp).getTime() >= cutoff);
          rangePoints = candidate.length >= 4 ? candidate : hist.slice(-36);
        }

        const prices = rangePoints.map(h => Number(h.price)).filter(Number.isFinite);
        const dayLow = prices.length ? Math.min(...prices) : (Number.isFinite(curPrice) ? curPrice : null);
        const dayHigh = prices.length ? Math.max(...prices) : (Number.isFinite(curPrice) ? curPrice : null);
        const lowHighStr = (dayLow !== null && dayHigh !== null) ? `$${dayLow.toFixed(2)} – $${dayHigh.toFixed(2)}` : "—";

        const statsLeft = el("span");
        statsLeft.innerHTML = `${activeTimeframe} Range: <b>${lowHighStr}</b>`;

        const statsRight = el("span");
        statsRight.innerHTML = `Prev: <b>${prevCloseStr}</b> · <span>${formatTime(data.price_timestamp)}</span>`;

        footer.append(statsLeft, statsRight);
        card.append(footer);

        tickersGrid.append(card);
      }

      totalCountPill.textContent = `${visibleCount} of ${TICKER_DEFS.length} Tickers`;
      bullishCountPill.textContent = `${bullishCount} Bullish`;
      bearishCountPill.textContent = `${bearishCount} Bearish`;

      if (visibleCount === 0) {
        tickersGrid.append(el("div", "empty-state", `No tickers match filter "${activeFilter}"`));
      }
    }

    async function loadData() {
      refreshBtn.disabled = true;
      lastUpdatedEl.textContent = "Fetching latest market quotes & sentiment…";

      try {
        // Parallel fetch of latest mass-monitor file and market.json
        const massPromise = (async () => {
          const idxRes = await fetch(`data/mass/index.json?t=${Date.now()}`, { cache: "no-store" });
          if (!idxRes.ok) throw new Error(`Data index returned status ${idxRes.status}`);
          const idxJson = await idxRes.json();
          const files = Array.isArray(idxJson.files) ? idxJson.files : [];
          if (!files.length) throw new Error("No data files in index");

          const latestFile = files[files.length - 1];
          const dataRes = await fetch(`data/mass/${encodeURIComponent(latestFile)}?t=${Date.now()}`, { cache: "no-store" });
          if (!dataRes.ok) throw new Error(`Failed to load ${latestFile}`);
          const text = await dataRes.text();
          const lines = text.split(/\r?\n/).filter(Boolean);
          if (!lines.length) throw new Error("Empty data file");
          const record = JSON.parse(lines[lines.length - 1]);
          return { record, filesCount: files.length };
        })();

        const marketPromise = (async () => {
          // 1. Try local site/data/market.json
          try {
            const mRes = await fetch(`data/market.json?t=${Date.now()}`, { cache: "no-store" });
            if (mRes.ok) return await mRes.json();
          } catch (e) {
            console.warn("Local data/market.json fetch failed, trying trading-dashboard remote...", e);
          }
          // 2. Try remote trader-dashboard GitHub Pages
          try {
            const rRes = await fetch(`https://knightkalman.github.io/trader-dashboard/data/market.json?t=${Date.now()}`, { cache: "no-store" });
            if (rRes.ok) return await rRes.json();
          } catch (re) {
            console.warn("Remote trader-dashboard market.json fetch failed...", re);
          }
          return {};
        })();

        const [massResult, marketResult] = await Promise.all([massPromise, marketPromise]);

        allTickerData = massResult.record.prices || {};
        allMarketData = marketResult || {};

        renderCards();
        lastUpdatedEl.textContent = `Updated ${formatTime(massResult.record.collected_at)} (${massResult.filesCount} archive days)`;
      } catch (err) {
        console.warn("Could not load via index, attempting direct fallback...", err);
        try {
          const today = new Date().toISOString().slice(0, 10);
          const directRes = await fetch(`data/mass/${today}.jsonl?t=${Date.now()}`, { cache: "no-store" });
          if (!directRes.ok) throw new Error("Direct fallback unavailable");
          const text = await directRes.text();
          const lines = text.split(/\r?\n/).filter(Boolean);
          const record = JSON.parse(lines[lines.length - 1]);
          allTickerData = record.prices || {};

          // Try fetching market.json
          try {
            const mRes = await fetch(`data/market.json?t=${Date.now()}`, { cache: "no-store" });
            if (mRes.ok) allMarketData = await mRes.json();
          } catch { /* optional */ }

          renderCards();
          lastUpdatedEl.textContent = `Updated ${formatTime(record.collected_at)} (direct fallback)`;
        } catch (innerErr) {
          console.error("Failed to load ticker data:", innerErr);
          lastUpdatedEl.textContent = "Data unavailable — ensure GitHub Actions collection has run.";
        }
      } finally {
        refreshBtn.disabled = false;
      }
    }

    // Timeframe button switches (24h / 7d)
    timeframeButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        timeframeButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTimeframe = btn.dataset.range;
        renderCards();
      });
    });

    searchBox.addEventListener("input", (e) => {
      activeFilter = e.target.value;
      renderCards();
    });

    refreshBtn.addEventListener("click", loadData);

    // Auto-refresh cadence (every 5 minutes)
    window.setInterval(loadData, 5 * 60 * 1000);

    // Initial load
    loadData();
  </script>
</body>
</html>
